# Render.com blueprint: New > Blueprint > pick this repository.
services:
  - type: web
    name: snap-quest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANTHROPIC_API_KEY      # paste your Claude API key in the Render dashboard
        sync: false
      - key: SNAPQUEST_MODEL
        value: claude-opus-5-5
      - key: SNAPQUEST_AI_PER_HOUR  # AI requests per visitor per hour
        value: "60"
      - key: SNAPQUEST_AI_PER_DAY   # AI requests for the whole site per day (cost cap)
        value: "1500"
